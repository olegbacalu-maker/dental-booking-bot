# ruff — ТОЛЬКО проверка (CI: `ruff check`), не форматирование.
# Набор ловит то, что ломается молча или падает только у клиники, а не стиль:
#   F       pyflakes: неопределённое имя (NameError в ветке, которую прогон не
#           прошёл), неиспользуемые импорт и переменная (часто — недописанная
#           проверка в наборе), переопределение, `is` с литералом;
#   E9      файл не разбирается;
#   PLE     ошибки, которые pylint считает ошибками (не советами);
#   RUF006  `asyncio.create_task` без ссылки — цикл держит задачу слабо, и
#           сборщик мусора может её прибить без строки в логе.
# ⛔ Стилевые семейства (E/W, I, UP, SIM) сюда не добавлять: массовая правка
#    формы смешала бы историю git со смыслом и ничего не поймала бы.
# ⚠️ B023 (замыкание на переменную цикла) пробовали 03.11: все десять мест —
#    функции, вызванные внутри той же итерации; пользы ноль, шум десять.
target-version = "py312"
extend-exclude = ["sandbox"]

[lint]
select = ["F", "E9", "PLE", "RUF006"]
# F541 — f-строка без подстановок: безвредна, а правка — чистая форма.
ignore = ["F541"]

[lint.per-file-ignores]
# Пакет db (03.11, db-split) реэкспортирует каждое имя прежнего db.py — около
# 260: весь код зовёт `from . import db; db.X`. Импорт здесь И ЕСТЬ назначение.
"bot/app/db/__init__.py" = ["F401"]
