name: dental-sandbox

# Серверный запуск того же кода: SQLite в томе, вход по ADMIN_KEY.
# Postgres-издание снято 12.10.2026 (тег archive/pg-edition).
services:
  bot:
    build: ./bot
    container_name: dental_sandbox_bot
    environment:
      DATABASE_URL: sqlite:////data/dental.db
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      # ⛔ Обязателен: первичную установку PIN программа принимает только с
      # этого же компьютера, а запрос в контейнер приходит из сети Docker —
      # без ключа журнал заперт для всех.
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env}
      CLINIC_CONFIG: /config/clinic.json
      TZ: Europe/Chisinau
    volumes:
      # rw: страница настроек пишет конфиг обратно в этот файл
      - ./clinic.json:/config/clinic.json
      - dbdata:/data
    ports:
      - "8088:8088"
    mem_limit: 256m

volumes:
  dbdata:
