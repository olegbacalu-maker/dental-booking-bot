# Second clinic from the SAME image — only clinic.json differs.
# Run from this folder: docker compose up -d --build
name: clinic-zambet

services:
  bot:
    build: ../../bot
    container_name: zambet_bot
    environment:
      DATABASE_URL: sqlite:////data/dental.db
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env}
      CLINIC_CONFIG: /config/clinic.json
      TZ: Europe/Chisinau
    volumes:
      - ./clinic.json:/config/clinic.json
      - zambet_data:/data
    ports:
      - "8089:8088"
    mem_limit: 256m

volumes:
  zambet_data:
