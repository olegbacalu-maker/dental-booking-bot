# PHASE 1 — базовый прогон тестов движка.
#
# Ступень 1 из пяти (лестница — docs/dentpilot-2/release.md): здесь ТОЛЬКО тесты. Ни сборки,
# ни релиза, ни единого секрета. Сборка exe, дымовой тест и E2E приезжают
# отдельными ступенями. Rust здесь — только `cargo test` оболочки (03.11),
# отдельной работой под кэшем: холодную сборку платит первый прогон, а не
# каждая правка.
#
# ⛔ Права минимальные и публикацией здесь не пахнет: publish остаётся ручной
#    командой с машины Олега. Workflow не имеет права выпускать релизы.
# ⛔ Сторонние action'ы пришпилены по SHA коммита, а не по тегу: тег
#    перевешивается, SHA — нет.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Движок (тесты и сторожа)
    runs-on: windows-latest
    # 60, не 45 (10.11, 2.14.1): прогон + мутация шли 33–42 мин, и на медленных
    # раннерах мутация дважды не успела к 45-й минуте — работа «отменена», не красная.
    timeout-minutes: 60

    steps:
      - name: Забрать исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ Версия ровно 3.14: именно на ней собрано .venv-desktop у Олега
      # (sqlcipher3 приезжает бинарным колесом cp314-cp314-win_amd64, и на
      # другой версии Python его пришлось бы собирать из исходников — а Build
      # Tools на раннере нет).
      - name: Поставить Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: bot/requirements-desktop.lock

      # ⛔ Папка называется именно .venv-desktop и лежит именно в корне:
      # tests/harness.py:29 берёт интерпретатор по этому пути БУКВАЛЬНО
      # (PYTHON = ROOT / ".venv-desktop" / "Scripts" / "python.exe").
      # Переименуешь — прогон не стартует вовсе.
      # Ставится LOCK, а не requirements-desktop.txt: там закреплены только
      # прямые зависимости, и раннер брал свежие косвенные (starlette 1.10
      # против 1.3.1 в exe) — проверялось не то, что едет клинике. Хеши
      # обязательны, --no-deps: всё дерево уже перечислено.
      - name: Собрать окружение сборки
        run: |
          python -m venv .venv-desktop
          .venv-desktop\Scripts\python.exe -m pip install --upgrade pip
          .venv-desktop\Scripts\python.exe -m pip install --require-hashes --no-deps -r bot\requirements-desktop.lock

      # Проверка до прогона: нативные модули действительно приехали. Без неё
      # отсутствующий sqlcipher3 дал бы не отказ установки, а красный набор
      # test_dbcrypt в середине прогона — на шесть минут позже и невнятнее.
      - name: Убедиться, что нативные модули на месте
        run: |
          .venv-desktop\Scripts\python.exe -c "import sqlcipher3, pyzipper, fastapi, uvicorn; print('ok')"

      # Число проверок и время НЕ зашиты: они растут, и workflow, ждущий
      # старого числа, однажды соврал бы. Их называет сам прогон.
      - name: Прогон
        run: .venv-desktop\Scripts\python.exe tests\run_tests.py

      # Сторожа архитектурных правил ломаются молча: список, который ВКЛЮЧАЕТ
      # требование, при переименовании находит ноль нарушителей и зеленеет
      # навсегда. mutate.py ломает каждое правило в копии дерева и требует
      # красного — без него test_structure.py ничего не значит.
      #
      # ⚠️ Шаг идёт даже после красного прогона (!cancelled), и это намеренно:
      # одна отправка должна рассказать ОБА ответа сразу. Иначе починка тестов
      # и починка сторожей — это два круга ожидания вместо одного.
      - name: Мутация сторожей
        if: ${{ !cancelled() }}
        run: .venv-desktop\Scripts\python.exe tests\mutate.py

  # Оболочка Tauri (shell/): модульные проверки Rust. Отдельная работа, а не
  # шаг движка, — идёт параллельно его прогону. Холодная сборка Tauri в
  # отладочном профиле — ~2 мин на машине Олега, на раннере дольше; кэш
  # (rust-cache: реестр и target/) снимает её до компиляции самой оболочки.
  # ⚠️ build.rs рисует заставку и значок Python'ом программы (PIL из
  # .venv-desktop) — без окружения сборка паникует, поэтому оно ставится
  # здесь тем же lock'ом.
  shell:
    name: Оболочка (cargo test)
    runs-on: windows-latest
    timeout-minutes: 30
    # Версия Rust — та же, что на машине сборки (`rustc --version` там).
    # Подняли её там — поднять здесь: иначе CI проверяет не тем
    # компилятором, которым собран exe. Окружением, а не `rustup default`:
    # так её видит и rust-cache (ключ кэша), и каждый вызов cargo — а не
    # установленный на раннере stable, если шаг установки молча не сработал.
    env:
      RUSTUP_TOOLCHAIN: 1.99.1

    steps:
      - name: Забрать исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Поставить Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: bot/requirements-desktop.lock

      - name: Окружение для build.rs
        run: |
          python -m venv .venv-desktop
          .venv-desktop\Scripts\python.exe -m pip install --require-hashes --no-deps -r bot\requirements-desktop.lock

      - name: Поставить Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update

      - name: Версия Rust
        run: rustc --version

      - name: Кэш cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: shell -> target

      # --locked: Cargo.lock не переписывается, как и в Build-Installer.ps1.
      - name: cargo test
        working-directory: shell
        run: cargo test --locked

  # Python-исходники: ruff ТОЛЬКО проверкой (набор правил и почему он такой —
  # ruff.toml в корне). Ubuntu и секунды: ставится один ruff.
  # ⚠️ Версия закреплена: новая приносит новые находки, и красный CI на ровном
  # месте не нужен. Поднимать руками вместе с правками находок.
  lint:
    name: Python (ruff check)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Забрать исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Поставить Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: ruff check
        run: |
          python -m pip install ruff==0.17.3
          ruff check --output-format=github .

      # CI ставит lock, сборка и люди правят requirements*.txt
      - name: lock не отстал от requirements
        run: python scripts/lock_check.py

  # React-клиент (DentPilot 2.0): типы, lint, тесты компонентов, сборка.
  # Отдельная работа, а не шаг движка: Node на windows-runner не нужен, а
  # ubuntu поднимает её за минуту. Бандл здесь НЕ публикуется — он собирается
  # заново в Build-Engine.ps1 на машине сборки; работа лишь доказывает, что
  # чистый клон собирается и проверки клиента зелёные.
  frontend:
    name: Клиент (typecheck, lint, тесты, сборка)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Забрать исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Поставить Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Зависимости из lock-файла
        run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Тесты клиента
        run: npm test

      # Сборка — последним и всегда: она пишет в bot/app/static, и её
      # результат на раннере никому не нужен, кроме как доказательством.
      - name: Сборка
        if: ${{ !cancelled() }}
        run: npm run build

  # Сервер лицензий (cloud/, шаг 1 плана cloud.md): своя программа, свой прогон.
  # Ubuntu, а не Windows: серверу жить на VPS, и ничего родного Windows в нём
  # нет. Ключ выдачи в прогоне — тестовый из tests/fixtures/license/, тот же,
  # что знают тесты движка: выданный файл обязан пройти проверку движка.
  cloud:
    name: Облако (сервер лицензий)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud

    steps:
      - name: Забрать исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Поставить Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: cloud/requirements.lock

      # lock с хешами, как у движка; requirements.txt — только вход для него
      - name: Зависимости
        run: python -m pip install --require-hashes --no-deps -r requirements.lock

      - name: Прогон сервера
        run: python tests/run_tests.py

      # Пары «слом → красная проверка» облака (07.11, cloud/tests/mutate.py): поведение в копии
      # дерева, каждая пара требует красной ИМЕННО своей проверки. Как у движка — и после
      # красного прогона: одна отправка рассказывает оба ответа.
      - name: Мутация сторожей облака
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python tests/mutate.py
