# Оболочка DentPilot на Tauri 2: окно, полоса меню, значок у часов, уведомления;
# движок (Python) — отдельным процессом рядом. Контракт частей —
# docs/dentpilot-2/tauri-contract.md, устройство — docs/dentpilot-2/tauri.md.
# ⛔ Версии Tauri и всего, что идёт вместе с ним, — только `=`: Tauri 3 вышел
# альфой, и «^2» однажды привёз бы чужое поведение окна без единой правки здесь.
[package]
name = "dentpilot-shell"
# Версия файла DentPilot.exe — НЕ отсюда: build.rs берёт APP_VERSION из
# bot/app/engine.py (одна версия у выпуска, как у прежней сборки).
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
# ярлык, обновление и сторож перезапуска знают программу по имени файла
name = "DentPilot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# unstable — два WebView в одном окне (полоса меню + программа); tray-icon — значок у часов.
tauri = { version = "=2.12.1", features = ["unstable", "tray-icon"] }
# Второй запуск не открывает второе окно, а показывает спрятанное первое.
tauri-plugin-single-instance = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Те же версии, что уже тянет сам Tauri (Cargo.lock): второй копии нет.
# webview2-com — свои обработчики WebView2: канал dpShell.send, клавиши
# браузера, правая кнопка, куки; windows — уведомления Windows (WinRT).
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_System_Com",
] }
windows-core = "=0.62.2"
# «Задание» Windows для движка, окна сообщений, диалог «Сохранить как»,
# нажатия клавиш для «Editare», паспорт программы, реестр, случайный токен,
# сеанс процесса (сторож обновления, watch.rs).
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Без CLI Tauri сборка cargo'м — «режим разработки»; этот флаг делает её обычной
# (страницы оболочки вшиваются в exe, а не ждутся с сервера разработки).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
